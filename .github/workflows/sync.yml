name: Follow Pulumi Cloudflare releases
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pulumi_typing.sync --package pulumi-cloudflare --output generated
      - run: pytest
      - name: Commit changed stubs
        run: |
          if [ -n "$(git status --porcelain generated)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add generated
            git commit -m 'chore: regenerate stubs from upstream SDK'
            git push
          fi
