[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pulumi-typing"
version = "0.1.0"
description = "Generate enhanced typing overlays for Pulumi Python SDKs"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
